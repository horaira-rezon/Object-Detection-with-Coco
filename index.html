<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0d10">
<title>Object Detection with COCO</title>
<link rel="stylesheet" href="desktop.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body class="setup-body">
<header class="setup-header">
<div class="brand">Object Detection with COCO</div>
<div class="model-badge">YOLO26N · ONNX</div>
</header>
<main class="setup-main">
<section class="setup-card">
<div class="eyebrow">COCO OBJECT DETECTION</div>
<h1>Choose what you want to detect</h1>
<p class="intro">Select one or more COCO classes, then start your browser-based webcam detection session.</p>
<div class="class-toolbar">
<div class="search-wrap"><input id="class-search" type="search" placeholder="Search COCO classes..." autocomplete="off"></div>
<div class="toolbar-actions"><button id="select-all" class="small-button">Select All</button><button id="clear-all" class="small-button ghost">Clear All</button></div>
</div>
<div id="class-grid" class="class-grid"></div>
<div class="setup-footer">
<div id="selection-count" class="selection-count">80 of 80 classes selected</div>
<button id="start-button" class="primary-button">Start Detecting</button>
</div>
</section>
</main>
<script src="classes.js"></script>
<script src="app.js"></script>
<script>initSetupPage();</script>
</body>
</html>
