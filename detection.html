<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <meta name="theme-color" content="#0b0d10">
    <title>Detection · Object Detection with COCO</title>
    <link rel="stylesheet" href="desktop.css">
    <link rel="stylesheet" href="mobile.css">
</head>

<body class="detection-body">
    <header class="detect-header">
        <button id="back-button" class="back-button" aria-label="Back to setup">←</button>
        <div class="brand">Object Detection with COCO</div>
        <div class="header-status"><span id="model-dot" class="status-dot"></span><span id="model-status">Loading
                model</span></div>
        <button id="menu-button" class="hamburger"
            aria-label="Open controls"><span></span><span></span><span></span></button>
    </header>
    <div class="detection-layout">
        <aside class="side-panel left-panel">
            <div class="panel-title">COCO Classes</div>
            <div class="panel-tools"><button id="detect-select-all" class="small-button">All</button><button
                    id="detect-clear-all" class="small-button ghost">None</button></div>
            <div class="detect-search"><input id="detect-search-input" type="search" placeholder="Search classes...">
            </div>
            <div id="detect-class-list" class="detect-class-list"></div>
        </aside>
        <main class="camera-stage">
            <div class="camera-frame">
                <video id="camera" autoplay muted playsinline></video>
                <canvas id="overlay"></canvas>
                <div class="stream-overlay top-left">
                    <div>OBJECT DETECTION</div>
                    <div>YOLO26N · COCO · ONNX</div>
                    <div id="stream-state">LOADING MODEL</div>
                </div>
                <div id="fps-display" class="stream-overlay top-right">FPS: --</div>
                <div class="stream-overlay bottom-left">BROWSER INFERENCE</div>
                <div id="camera-message" class="camera-message">Loading YOLO26N...</div>
            </div>
        </main>
        <aside class="side-panel right-panel">
            <div class="panel-title">Controls</div>
            <div class="control-section">
                <label class="switch-row"><span>Horizontal Mirror</span><input id="mirror-toggle" type="checkbox"><span
                        class="switch"></span></label>
            </div>
            <div class="control-section">
                <div class="section-label">Object Tracking</div>
                <div class="tracker-options">
                    <button class="tracker-button active" data-tracker="none">No Tracking</button>
                    <button class="tracker-button" data-tracker="bytetrack">ByteTrack</button>
                    <button class="tracker-button" data-tracker="botsort">BotSORT</button>
                    <button class="tracker-button" data-tracker="ocsort">OC-SORT</button>
                </div>
            </div>
            <div class="control-section">
                <div class="section-label">Stream</div>
                <label class="switch-row"><span>FPS Viewer</span><input id="fps-toggle" type="checkbox" checked><span
                        class="switch"></span></label>
            </div>
        </aside>
    </div>
    <div id="mobile-menu" class="mobile-menu">
        <div class="mobile-menu-inner">
            <div class="mobile-menu-title">Detection Controls</div>
            <div class="control-section first-control">
                <div class="camera-facing-options">
                    <button class="tracker-button" data-camera-facing="user">Front Camera</button>
                    <button class="tracker-button active" data-camera-facing="environment">Rear Camera</button>
                </div>
            </div>
            <div class="control-section">
                <div class="section-label">Camera</div>
                <label class="switch-row"><span>Horizontal Mirror</span><input id="mobile-mirror-toggle"
                        type="checkbox"><span class="switch"></span></label>
            </div>
            <div class="control-section">
                <div class="section-label">Object Tracking</div>
                <div class="tracker-options">
                    <button class="tracker-button active" data-mobile-tracker="none">No Tracking</button>
                    <button class="tracker-button" data-mobile-tracker="bytetrack">ByteTrack</button>
                    <button class="tracker-button" data-mobile-tracker="botsort">BotSORT</button>
                    <button class="tracker-button" data-mobile-tracker="ocsort">OC-SORT</button>
                </div>
            </div>
            <div class="control-section">
                <label class="switch-row"><span>FPS Viewer</span><input id="mobile-fps-toggle" type="checkbox"
                        checked><span class="switch"></span></label>
            </div>
            <div class="mobile-classes-head"><span>COCO Classes</span>
                <div><button id="mobile-select-all" class="small-button">All</button><button id="mobile-clear-all"
                        class="small-button ghost">None</button></div>
            </div>
            <div class="detect-search"><input id="mobile-search-input" type="search" placeholder="Search classes...">
            </div>
            <div id="mobile-class-list" class="mobile-class-list"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
    <script src="classes.js"></script>
    <script src="app.js"></script>
    <script>initDetectionPage();</script>
</body>

</html>
